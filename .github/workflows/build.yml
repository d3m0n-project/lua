name: Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: dependencies install
      run: sudo apt install gcc-arm-none-eabi -y
    - name: compiler install
      run: git clone https://github.com/d3m0n-project/d3m0n_os
    - name: make
      run: make -C d3m0n_os/compiler
    - name: build
      run: PATH="$PATH:$HOME/com.ares" make
